version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    EKS_CLUSTER_NAME: brain-tasks-eks

phases:
  install:
    commands:
      - curl -sSLO https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/kubectl
      - kubectl version --client

  pre_build:
    commands:
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $EKS_CLUSTER_NAME
      - IMAGE_URI=$(cat image-uri.txt)
      - echo "Deploying $IMAGE_URI"

  build:
    commands:
      - IMAGE_URI=$(cat image-uri.txt)
      - test -n "$IMAGE_URI"
      - kubectl set image deployment/brain-tasks-deployment brain-tasks-container=$IMAGE_URI
      - kubectl rollout status deployment/brain-tasks-deployment --timeout=300s

  post_build:
    commands:
      - kubectl get deployments
      - kubectl get pods -o wide
      - kubectl get services
